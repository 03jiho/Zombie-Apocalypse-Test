*{box-sizing:border-box;}
html,body{background:var(--void);}
body{

}

.font-display{font-family:'Black Han Sans','Noto Sans KR',sans-serif;letter-spacing:0.01em;}
.font-mono{font-family:'JetBrains Mono',ui-monospace,monospace;}

h1,h2,h3{text-wrap:balance;}

.vignette{

.stage{

.doc-frame{width:100%;max-width:660px;}

.eyebrow{

}

.wp-current-glow{

.opposite-box{border:1px dashed var(--border-soft);padding:1.1rem 1.2rem;margin-top:1.8rem;}

.rank-row{display:flex;align-items:center;gap:0.8rem;padding:0.6rem 0;border-bottom:1px solid var(--border-soft);}
.rank-row:last-child{border-bottom:none;}
.rank-num{font-family:'JetBrains Mono',monospace;font-weight:700;color:var(--blood-bright);width:1.5rem;flex-shrink:0;}

@media (prefers-reduced-motion: reduce){
  .grain{animation:none;}
  .stage{transition-duration:0.01s;}
  .vignette{transition-duration:0.01s;}

}

const TOTAL_Q = QUESTIONS.length;
const MAX_AXIS = TOTAL_Q * 2;

   SCORING / RESOURCE UTILS — pure functions, no React.

function clamp(v,min,max){ return Math.max(min,Math.min(max,v)); }

function tallyAnswers(answers){
  const base = {xSum:0,ySum:0,kills:0,saves:0, ...START_RESOURCES};
  return answers.reduce((acc,c)=>({
    xSum:acc.xSum+(c.x||0),
    ySum:acc.ySum+(c.y||0),
    kills:acc.kills+(c.kill||0),
    saves:acc.saves+(c.save||0),
    companionBond:clamp(acc.companionBond+(c.companionBond||0),0,100),
    companionsRemaining:clamp(acc.companionsRemaining+(c.companionsRemaining||0),0,4)
  }),base);
}

function normalize(sum){ return clamp(((sum+MAX_AXIS)/(MAX_AXIS*2))*100,0,100); }

function classifyCode(xSum,ySum){
  const xBand = xSum<=-8 ? "A" : xSum<=0 ? "B" : xSum<=8 ? "C" : "D";
  const yBand = ySum<=-6 ? "1" : ySum<6 ? "2" : "3";
  return xBand+yBand;
}

function oppositeCode(code){
  const invX = {A:"D",B:"C",C:"B",D:"A"};
  const invY = {1:"3",2:"2",3:"1"};
  return invX[code[0]]+invY[code[1]];
}

function calculateStats(tally){
  const {xSum,ySum,kills,saves,companionBond,companionsRemaining} = tally;
  const normX = normalize(xSum);
  const normY = normalize(ySum);
  return {
    survival: Math.round(clamp(28 + normX*0.22 + normY*0.3 + companionsRemaining*7 + (saves-kills)*1.2, 4, 100)),
    humanity: Math.round(clamp(100 - normX - kills*2 + saves*2, 0, 100)),
    charisma: Math.round(clamp(normY*0.35 + (Math.abs(xSum)/MAX_AXIS)*100*0.25 + companionBond*0.35, 0, 100)),
    cruelty: Math.round(normX),
    trust: Math.round(clamp(companionBond, 0, 100))
  };
}

function backgroundColor(xSum){
  const t = clamp((xSum + MAX_AXIS)/(MAX_AXIS*2), 0, 1);
  const cool=[10,9,8], mid=[20,17,14], hot=[42,7,9];
  const lerp=(a,b,f)=>Math.round(a+(b-a)*f);
  let c;
  if(t<=0.5){ const f=t/0.5; c=cool.map((v,i)=>lerp(v,mid[i],f)); }
  else{ const f=(t-0.5)/0.5; c=mid.map((v,i)=>lerp(v,hot[i],f)); }
  return `rgb(${c[0]},${c[1]},${c[2]})`;
}

function betrayalChance(codeA,codeB){
  const xVal={A:0,B:1,C:2,D:3}, yVal={1:0,2:1,3:2};
  const dx = Math.abs(xVal[codeA[0]]-xVal[codeB[0]]);
  const dy = Math.abs(yVal[codeA[1]]-yVal[codeB[1]]);
  const base = dx*18 + dy*10;
  const seed = codeA.charCodeAt(0)*31 + codeA.charCodeAt(1) + codeB.charCodeAt(0)*17 + codeB.charCodeAt(1);
  return clamp(Math.round(base + (seed%15)), 3, 97);
}

async function copyToClipboard(text){
  try{ await navigator.clipboard.writeText(text); return true; }
  catch(e){
    try{
      const ta=document.createElement("textarea");
      ta.value=text; ta.style.position="fixed"; ta.style.opacity="0";
      document.body.appendChild(ta); ta.focus(); ta.select();
      document.execCommand("copy"); document.body.removeChild(ta);
      return true;
    }catch(e2){ return false; }
  }
}

function buildShareText(type){
  return `나는 '생존자 기록부'에서 "${type.name}" 유형이었다. ${type.tagline} 당신의 생존 유형은?`;
}

async function shareResult(type){
  const url = typeof window!=="undefined" ? window.location.href : "";
  const text = buildShareText(type);
  if(typeof navigator!=="undefined" && navigator.share){
    try{ await navigator.share({title:"생존자 기록부", text, url}); return "shared"; }
    catch(e){ return null; }
  }
  const ok = await copyToClipboard(`${text} ${url}`);
  return ok ? "copied" : "failed";
}

function useCountdown(active,durationSec,onExpire,resetKey){
  const [secondsLeft,setSecondsLeft] = useState(durationSec);
  const expireRef = useRef(onExpire);
  expireRef.current = onExpire;
  useEffect(()=>{
    if(!active) return;
    setSecondsLeft(durationSec);
    const iv = setInterval(()=>{
      setSecondsLeft(s=>{
        if(s<=1){ clearInterval(iv); expireRef.current(); return 0; }
        return s-1;
      });
    },1000);
    return ()=>clearInterval(iv);
  },[active,durationSec,resetKey]);
  return secondsLeft;
}

function toneForRisk(risk){
  return risk==="low" ? "var(--signal)" : risk==="high" ? "var(--blood-bright)" : "var(--amber)";
}

function WaypointTrail({answered}){
  const segs = TOTAL_Q;
  const answeredCount = answered.length;
  const w = 320, h = 46;
  const marginX = 20;
  const step = (w - marginX*2) / (segs-1);
  const points = Array.from({length:segs}).map((_,i)=>({
    x: marginX + step*i,
    y: h/2 + Math.sin(i*1.15)*11
  }));
  const remaining = points.slice(answeredCount);
  return (
    <div aria-label={`여정 진행: ${segs}개 갈림길 중 ${answeredCount+1}번째`}>
      <svg viewBox={`0 0 ${w} ${h}`} width="100%" height={h} role="presentation">
        {remaining.length>1 &&
          <polyline points={remaining.map(p=>`${p.x},${p.y}`).join(" ")}
            fill="none" stroke="var(--border-soft)" strokeWidth="2" strokeDasharray="1 7" strokeLinecap="round"/>}
        {Array.from({length:answeredCount}).map((_,i)=>{
          const tone = toneForRisk(answered[i].risk);
          const a = points[i], b = points[i+1];
          return <line key={`seg${i}`} x1={a.x} y1={a.y} x2={b.x} y2={b.y}
            stroke={tone} strokeOpacity="0.55" strokeWidth="2" strokeLinecap="round"/>;
        })}
        {points.map((p,i)=>{
          if(i<answeredCount) return <circle key={i} cx={p.x} cy={p.y} r="5.5" fill={toneForRisk(answered[i].risk)}/>;
          if(i===answeredCount) return (
            <g key={i}>
              <circle className="wp-current-glow" cx={p.x} cy={p.y} r="10" fill="var(--dust)"/>
              <circle cx={p.x} cy={p.y} r="6" fill="var(--bone)"/>
            </g>
          );
          return <circle key={i} cx={p.x} cy={p.y} r="4.5" fill="var(--void)" stroke="var(--border-soft)" strokeWidth="1.5"/>;
        })}
      </svg>
    </div>
  );
}

function CountdownRing({seconds,total}){
  const r=18, circ=2*Math.PI*r;
  const pct = seconds/total;
  return (
    <svg width="46" height="46" viewBox="0 0 46 46" role="timer" aria-label={`남은 시간 ${seconds}초`}>
      <circle cx="23" cy="23" r={r} fill="none" stroke="var(--border-soft)" strokeWidth="4"/>
      <circle cx="23" cy="23" r={r} fill="none" stroke="var(--blood-bright)" strokeWidth="4"
        strokeDasharray={circ} strokeDashoffset={circ*(1-pct)} strokeLinecap="round"
        transform="rotate(-90 23 23)" style={{transition:"stroke-dashoffset 1s linear"}}/>
      <text x="23" y="28" textAnchor="middle" fontFamily="'JetBrains Mono',monospace" fontSize="16" fontWeight="700" fill="var(--bone)">{seconds}</text>
    </svg>
  );
}

function QuizScreen({index,answered,onAnswer}){
  const q = QUESTIONS[index];
  const joinedParty = answered.some(c=>c.joinedParty);
  const situationText = (!joinedParty && q.situationSolo) ? q.situationSolo : q.situation;
  const displayChoices = (!joinedParty && q.choicesSolo) ? q.choicesSolo : q.choices;

  const handleExpire = useCallback(()=>{
    onAnswer(displayChoices[q.isWorstIndex], true);
  },[q,onAnswer,displayChoices]);
  const secondsLeft = useCountdown(!!q.timer, 10, handleExpire, q.id);

  return (
    <div className="doc-frame">
      <div className="eyebrow">
        <span>기록 {String(index+1).padStart(2,'0')} / {String(TOTAL_Q).padStart(2,'0')}</span>

      <div className="mb-6"><WaypointTrail answered={answered}/></div>
      <div className="torn-card">
        {q.timer &&
          <div className="flex items-center gap-3 mb-5">
            <CountdownRing seconds={secondsLeft} total={10}/>
            <span className="psych-tag" style={{color:'var(--blood-bright)'}}>시간이 없다 — 곧 몸이 먼저 반응한다</span>
          </div>}

          <div className="warn-banner">

  ];
  const n=axes.length;
  const w=300,h=296,cx=150,cy=146,r=74;
  const angleFor=i=>270+i*(360/n);
  const pt=(deg,radius)=>{const rad=deg*Math.PI/180; return [cx+radius*Math.cos(rad), cy+radius*Math.sin(rad)];};
  const rings=[0.25,0.5,0.75,1];
  const dataPoints = axes.map((a,i)=>pt(angleFor(i),(stats[a.key]/100)*r));
  const dataPath = dataPoints.map(p=>p.join(",")).join(" ");
  return (
    <svg viewBox={`0 0 ${w} ${h}`} width="100%" role="img" aria-label="생존확률, 카리스마, 신뢰도, 잔혹함, 인간성 능력치 레이더 차트">
      {rings.map((f,i)=>(
        <polygon key={i} points={axes.map((a,j)=>pt(angleFor(j),r*f).join(",")).join(" ")}
          fill="none" stroke="var(--border-soft)" strokeWidth="1"/>
      ))}
      {axes.map((a,i)=>{
        const [x,y]=pt(angleFor(i),r);
        return <line key={i} x1={cx} y1={cy} x2={x} y2={y} stroke="var(--border-soft)" strokeWidth="1"/>;
      })}
      <polygon points={dataPath} fill="var(--blood)" fillOpacity="0.35" stroke="var(--blood-bright)" strokeWidth="2"/>
      {dataPoints.map((p,i)=>(<circle key={i} cx={p[0]} cy={p[1]} r="3.2" fill="var(--blood-bright)"/>))}
      {axes.map((a,i)=>{
        const [lx,ly]=pt(angleFor(i), r+32);
        return (
          <g key={i}>
            <text x={lx} y={ly-4} textAnchor="middle" fill="var(--dust)" fontSize="9.5" fontFamily="'JetBrains Mono',monospace" letterSpacing="0.03em">{a.label}</text>
            <text x={lx} y={ly+12} textAnchor="middle" fill="var(--bone)" fontSize="13" fontWeight="700" fontFamily="'JetBrains Mono',monospace">{stats[a.key]}</text>
          </g>
        );
      })}
    </svg>
  );
}

function RankingSection({myCode}){
  const sorted = Object.entries(RESULT_TYPES).sort((a,b)=>b[1].baseSurvival-a[1].baseSurvival);
  const top3 = sorted.slice(0,3);
  const myRank = sorted.findIndex(([code])=>code===myCode)+1;
  const myType = RESULT_TYPES[myCode];
  return (
    <div className="torn-card mt-6">
      <p className="psych-tag mb-4">생존 랭킹 — 전체 12종 중 상위 3종</p>
      {top3.map(([code,t],i)=>(
        <div className="rank-row" key={code}>
          <span className="rank-num">{i+1}</span>
          <span className="rank-name" style={{color: code===myCode?'var(--blood-bright)':'var(--bone)'}}>{t.name}</span>
          <span className="rank-bar-track"><span className="rank-bar-fill" style={{width:`${t.baseSurvival}%`}}/></span>
          <span className="font-mono text-xs" style={{color:'var(--dust)',width:'2.2rem',textAlign:'right'}}>{t.baseSurvival}</span>
        </div>
      ))}
      <p className="mt-4 text-sm leading-relaxed" style={{color:'var(--dust)'}}>
        당신의 유형 <b style={{color:'var(--bone)'}}>{myType.name}</b>은(는) 전체 12종 중 생존 랭킹 <b style={{color:'var(--blood-bright)'}}>{myRank}위</b>입니다.
      </p>
    </div>
  );
}

function ShareCard({type,stats,tally}){
  return (
    <div className="share-card">
      <p className="font-mono text-xs mb-2" style={{color:'var(--blood-bright)',letterSpacing:'0.15em'}}>생존자 기록부</p>
      <h3 className="font-display" style={{fontSize:'1.8rem',color:'var(--bone)'}}>{type.name}</h3>
      <p className="text-sm mt-1" style={{color:'var(--dust)'}}>{type.tagline}</p>
      <div className="mt-4 flex gap-4 flex-wrap font-mono text-xs" style={{color:'var(--dust)'}}>
        <span>생존 {stats.survival}</span><span>인간성 {stats.humanity}</span><span>카리스마 {stats.charisma}</span>
        <span>잔혹함 {stats.cruelty}</span><span>신뢰 {stats.trust}</span>
      </div>
      <div className="mt-3 flex gap-5 font-mono text-xs">
        <span style={{color:'var(--blood-bright)'}}>☠ {tally.kills}</span>
        <span style={{color:'var(--signal)'}}>♥ {tally.saves}</span>
        <span style={{color:'var(--dust)'}}>곁에 남은 사람 {tally.companionsRemaining}</span>
      </div>
    </div>
  );
}

function ResultScreen({tally,onRestart,onGotoCompat}){
  const code = useMemo(()=>classifyCode(tally.xSum,tally.ySum),[tally]);
  const type = RESULT_TYPES[code];
  const oppositeType = RESULT_TYPES[oppositeCode(code)];
  const stats = useMemo(()=>calculateStats(tally),[tally]);
  const [copyState,setCopyState] = useState(false);

  const handleShare = useCallback(async()=>{
    const result = await shareResult(type);
    if(result==="shared") setCopyState("공유됨");
    else if(result==="copied") setCopyState("링크 복사됨");
    else if(result==="failed") setCopyState("복사 실패");
    if(result) setTimeout(()=>setCopyState(false),2200);
  },[type]);

  return (
    <div className="doc-frame">
      <div className="eyebrow">
        <span>사건 기록 // 종결</span>
        <span>기록 {TOTAL_Q} / {TOTAL_Q}</span>
      </div>
      <div className="relative">
      <div className="torn-card">
        <p className="font-mono text-xs mb-3" style={{color:'var(--blood-bright)',letterSpacing:'0.15em'}}>최종 분류</p>
        <h2 className="font-display" style={{fontSize:'clamp(2rem,7vw,3rem)',lineHeight:1.1,color:'var(--bone)'}}>{type.name}</h2>
        <p className="mt-3 leading-relaxed" style={{color:'var(--dust)',maxWidth:'56ch'}}>{type.tagline}</p>

        <div className="mt-8 grid gap-6 items-center grid-cols-1 sm:grid-cols-[minmax(0,220px)_1fr]">
          <RadarChart stats={stats}/>
          <div className="flex flex-col gap-3">
            <div className="stat-tile">
              <span className="stat-num" style={{color:'var(--blood-bright)'}}>{tally.kills}</span>
              <span className="stat-label">당신이 죽인 사람</span>
            </div>
            <div className="stat-tile">
              <span className="stat-num" style={{color:'var(--signal)'}}>{tally.saves}</span>
              <span className="stat-label">당신이 구한 사람</span>
            </div>
            <div className="stat-tile">
              <span className="stat-num" style={{color:'var(--bone)'}}>{tally.companionsRemaining}</span>
              <span className="stat-label">당신 곁에 남은 사람</span>
            </div>
          </div>
        </div>

        <div className="opposite-box">
          <p className="psych-tag mb-2">당신과 정반대의 생존자</p>
          <p style={{color:'var(--bone)',fontWeight:700}}>{oppositeType.name}</p>
          <p className="text-sm mt-1" style={{color:'var(--dust)'}}>{oppositeType.tagline}</p>
          <p className="text-sm mt-2" style={{color:'var(--dust)',opacity:0.8}}>이 유형인 사람에게 링크를 보내 서로의 결과를 비교해보세요.</p>
        </div>

        <p className="psych-tag mt-8 mb-2">최후 — 마지막 기록</p>
        <p className="epilogue">{type.epilogue}</p>

        <div className="mt-8 flex gap-3 flex-wrap">
          <button className="report-btn" onClick={onRestart}>기록 다시 시작</button>
          <button className="report-btn outline" onClick={handleShare}>{copyState || "링크 공유"}</button>
          <button className="report-btn outline" onClick={onGotoCompat}>생존 궁합 테스트 →</button>
        </div>
      </div>
      <span className="stamp">판정 완료</span>
      </div>

      <RankingSection myCode={code}/>
      <ShareCard type={type} stats={stats} tally={tally}/>
    </div>
  );
}

function CompatScreen({onBack}){
  const codes = Object.keys(RESULT_TYPES);
  const [a,setA] = useState(codes[0]);
  const [b,setB] = useState(codes[1]);
  const result = useMemo(()=>betrayalChance(a,b),[a,b]);
  const verdict = result<20 ? "천생연분 — 끝까지 함께 갈 조합입니다."
    : result<50 ? "위태롭지만, 아직은 서로를 믿을 수 있는 사이입니다."
    : result<80 ? "언젠가 금이 갈 조합입니다. 조심하세요."
    : "먼저 등에 칼을 꽂을 확률이 더 높은 조합입니다.";
  return (
    <div className="doc-frame">
      <div className="eyebrow">
        <span>생존자 대조 기록</span>
        <span>생존 궁합</span>
      </div>
      <div className="torn-card">
        <p className="font-mono text-xs mb-3" style={{color:'var(--blood-bright)',letterSpacing:'0.15em'}}>생존 궁합 진단</p>
        <h2 className="font-display" style={{fontSize:'clamp(1.6rem,6vw,2.2rem)',color:'var(--bone)'}}>생존 궁합 테스트</h2>
        <p className="mt-2 text-sm" style={{color:'var(--dust)'}}>두 사람의 생존자 유형을 골라, 서로를 배신할 확률을 계산해보세요.</p>

        <div className="mt-6 flex flex-col gap-4">
          <div>
            <label className="psych-tag block mb-2">첫 번째 생존자</label>
            <select className="compat-select" value={a} onChange={e=>setA(e.target.value)}>
              {codes.map(c=>(<option key={c} value={c}>{RESULT_TYPES[c].name}</option>))}
            </select>
          </div>
          <div>
            <label className="psych-tag block mb-2">두 번째 생존자</label>
            <select className="compat-select" value={b} onChange={e=>setB(e.target.value)}>
              {codes.map(c=>(<option key={c} value={c}>{RESULT_TYPES[c].name}</option>))}
            </select>
          </div>
        </div>

        <div className="mt-8 text-center">
          <div className="stat-num" style={{fontSize:'3rem',color:'var(--blood-bright)'}}>{result}%</div>
          <div className="stat-label mb-3">서로를 배신할 확률</div>
          <p className="epilogue" style={{textAlign:'left'}}>{verdict}</p>
        </div>

        <div className="mt-8">
          <button className="report-btn outline" onClick={onBack}>← 결과로 돌아가기</button>
        </div>
      </div>
    </div>
  );
}

/* =========================================================================
   APP
   ========================================================================= */

function App(){
  const [screen,setScreen] = useState("intro");
  const [qIndex,setQIndex] = useState(0);
  const [answered,setAnswered] = useState([]);
  const [toast,setToast] = useState(null);

  const tally = useMemo(()=>tallyAnswers(answered),[answered]);
  const bg = useMemo(()=>backgroundColor(tally.xSum),[tally.xSum]);
  const vignetteOpacity = useMemo(()=>clamp((tally.xSum+MAX_AXIS)/(MAX_AXIS*2),0,1)*0.6+0.15,[tally.xSum]);

  useEffect(()=>{
    if(!toast) return;
    const t = setTimeout(()=>setToast(null),3500);
    return ()=>clearTimeout(t);
  },[toast]);

  const handleAnswer = useCallback((choice,timedOut)=>{
    const next=[...answered,choice];
    setAnswered(next);
    if(choice.deathStat) setToast(choice.deathStat);
    else if(timedOut) setToast("⏱ 시간 초과 — 몸이 먼저 반응했다.");
    if(qIndex+1>=TOTAL_Q){ setScreen("result"); }
    else{ setQIndex(qIndex+1); }
  },[answered,qIndex]);

  const handleRestart = useCallback(()=>{
    setAnswered([]); setQIndex(0); setScreen("intro");
  },[]);

  return (
    <React.Fragment>
      <div className="grain"/>
      <div className="vignette" style={{opacity:vignetteOpacity}}/>
      <div className="stage" style={{backgroundColor: screen==="intro" ? backgroundColor(0) : bg}}>
        {screen==="intro" && <IntroScreen onStart={()=>setScreen("quiz")}/>}
        {screen==="quiz" && <QuizScreen index={qIndex} answered={answered} onAnswer={handleAnswer}/>}
        {screen==="result" && <ResultScreen tally={tally} onRestart={handleRestart} onGotoCompat={()=>setScreen("compat")}/>}
        {screen==="compat" && <CompatScreen onBack={()=>setScreen("result")}/>}
      </div>
      {toast && <div className="death-toast" key={toast}>☠ {toast}</div>}
    </React.Fragment>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App/>);
</script>
